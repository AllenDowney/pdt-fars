# The snake_case slice of FARS (PublicDataToolkit Tasks 5 and 13): the 2024 and
# 2017 national files, four tables. Hand-entered facts are origin: hand.

author: Claude (PublicDataToolkit Tasks 5 and 13)
# The hand-assigned measures are Task 5's (7a23f52), except the parkwork table's (PTYPE, PNUMOCCS,
# PDEATHS, PMODYEAR, PBODYTYP, PHARM_EV and the keys ST_CASE, VEH_NO), which are Task 13's (f2761b7).
date: "2026-11-19"

# Each release's data files, by table. Its codes come from the manual's column
# for that year (the release id is the data year).
releases:
  "2024":
    source: fars-2024-csv
    data:
      accident: fars2024_csv/FARS2024NationalCSV/accident.csv
      vehicle: fars2024_csv/FARS2024NationalCSV/vehicle.csv
      person: fars2024_csv/FARS2024NationalCSV/person.csv
      parkwork: fars2024_csv/FARS2024NationalCSV/parkwork.csv
  "2017":
    source: fars-2017-csv
    data:
      accident: fars2017/csv/accident.CSV
      vehicle: fars2017/csv/Vehicle.CSV
      person: fars2017/csv/Person.CSV
      parkwork: fars2017/csv/Parkwork.CSV

# Links between releases, generated by rule from the histories.
links:
  - {from: "2017", to: "2024"}

tables:
  accident:
    file: ACCIDENT
    variables: [ST_CASE, STATE, YEAR, MONTH, DAY_WEEK, HOUR, RUR_URB, LGT_COND, WEATHER, HARM_EV,
                MAN_COLL, FATALS, PERSONS, VE_TOTAL]
  vehicle:
    file: VEHICLE
    variables: [ST_CASE, VEH_NO, MOD_YEAR, BODY_TYP, ROLLOVER, DEFORMED, SPEEDREL, DR_DRINK]
  person:
    file: PERSON
    variables: [ST_CASE, VEH_NO, PER_NO, AGE, SEX, PER_TYP, INJ_SEV, SEAT_POS, REST_USE, DRINKING]
  parkwork:
    file: PARKWORK
    variables: [ST_CASE, VEH_NO, PTYPE, PNUMOCCS, PDEATHS, PMODYEAR, PBODYTYP, PHARM_EV]

measure:
  identifier: [ST_CASE, VEH_NO, PER_NO]
  continuous: [AGE, MOD_YEAR, PMODYEAR, YEAR, HOUR]
  count: [FATALS, PERSONS, VE_TOTAL, PNUMOCCS, PDEATHS]
  ordinal: [INJ_SEV, DEFORMED]
  categorical: [STATE, MONTH, DAY_WEEK, RUR_URB, LGT_COND, WEATHER, HARM_EV, MAN_COLL, BODY_TYP,
                ROLLOVER, SPEEDREL, DR_DRINK, SEX, PER_TYP, SEAT_POS, REST_USE, DRINKING,
                PTYPE, PBODYTYP, PHARM_EV]
