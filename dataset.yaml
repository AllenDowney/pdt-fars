standard_version: "0.1"
id: fars
title: Fatality Analysis Reporting System
publisher:
  name: National Highway Traffic Safety Administration (NHTSA), National Center for Statistics and Analysis
  url: https://www.nhtsa.gov/
url: https://www.nhtsa.gov/research-data/fatality-analysis-reporting-system-fars
description: >
  A census of fatal motor vehicle crashes in the 50 States, the District of
  Columbia and Puerto Rico since 1975, coded from police reports and other
  records. Not a survey: there are no questions, and "unknown" means the
  records didn't say.
citation: >
  National Center for Statistics and Analysis. (2026, April). Fatality Analysis
  Reporting System analytical user's manual, 1975-2024 (Report No. DOT HS 813
  794). National Highway Traffic Safety Administration.
  https://doi.org/10.21949/dz60-ft73
terms:
  url: https://www.nhtsa.gov/research-data/fatality-analysis-reporting-system-fars
  summary: >
    The manual's disclaimer says NHTSA distributes it "in the interest of
    information exchange" and that it "is available to the public"; it states no
    license or restriction, and FARS is a US government work. nhtsa.gov blocks
    scripts and headless browsers, so the site itself wasn't read. Allen Downey
    decided everything may ship.
  data: ship
  documentation: ship
  metadata: ship
  llm_processing: allowed
  reviewed_by: Allen Downey
  reviewed_on: "2026-11-19"
naming:
  case: upper
  note: SAS names, e.g. LGT_COND. The CSV files add a label column for most coded columns (LGT_CONDNAME).
dimensions:
  wave:
    label: data year
    column: YEAR
releases:
  - id: "2024"
    label: FARS 2024 national data files
    status: current
    sources: [fars-manual-1975-2024, fars-2024-csv]
    tables:
      - id: accident
        label: Crashes (ACCIDENT data file)
        description: One row per fatal crash.
        sources: [fars-manual-1975-2024, fars-2024-csv]
        key: [ST_CASE]
      - id: vehicle
        label: Vehicles in transport (VEHICLE data file)
        description: One row per motor vehicle in transport involved in a crash.
        sources: [fars-manual-1975-2024, fars-2024-csv]
        key: [ST_CASE, VEH_NO]
        references:
          - columns: [ST_CASE]
            table: accident
      - id: person
        label: People (PERSON data file)
        description: >
          One row per person involved: occupants of motor vehicles, and
          non-motorists. (ST_CASE, VEH_NO) refers to the vehicle table for
          occupants of vehicles in transport (PER_TYP 1, 2, 9) and to the
          parkwork table for occupants of parked or working vehicles (PER_TYP 3);
          VEH_NO is 0 for non-motorists.
        sources: [fars-manual-1975-2024, fars-2024-csv]
        key: [ST_CASE, VEH_NO, PER_NO]
        references:
          - columns: [ST_CASE]
            table: accident
          - columns: [ST_CASE, VEH_NO]
            table: vehicle
            when: {column: PER_TYP, in: [1, 2, 9]}
          - columns: [ST_CASE, VEH_NO]
            table: parkwork
            when: {column: PER_TYP, in: [3]}
      - id: parkwork
        label: Parked and working vehicles (PARKWORK data file)
        description: >
          One row per parked or working motor vehicle involved in a crash. Its
          VEH_NO values don't overlap the vehicle table's in the same crash.
          Replaced the VEHNIT file in 2010.
        sources: [fars-manual-1975-2024, fars-2024-csv]
        key: [ST_CASE, VEH_NO]
        references:
          - columns: [ST_CASE]
            table: accident
  - id: "2017"
    label: FARS 2017 national data files (final file, last updated 2022-03-02)
    status: current
    sources: [fars-manual-1975-2024, fars-2017-csv, fars-2017-release-note]
    # From the release note's Update Notes, verbatim (line breaks joined). The first entry,
    # 09/27/2018, is the release itself.
    revisions:
      - date: "2019-10-22"
        source: fars-2017-release-note
        description: 'this is the first release of the FARS 2017 final file.'
      - date: "2019-10-30"
        source: fars-2017-release-note
        description: 'acc_aux file is updated for National CSV and SAS zip files.'
      - date: "2020-02-19"
        source: fars-2017-release-note
        description: 'Puerto Rico alcohol imputation files are updated due to errors in the previous version.'
      - date: "2020-08-14"
        source: fars-2017-release-note
        description: 'The National accident.csv file has been updated for the variable "Longitute" precision from 4-digit to 8-digits.'
      - date: "2020-12-18"
        source: fars-2017-release-note
        description: 'The following updates are made for 2017 files: 1. Accident SAS File: add STATENAME, COUNTYNAME, CITYNAME 2. For many States (AL,AZ,AR,CA,CO,CT,DE, FL,GA,HI,IL,IN,KS,KY,LA, MD,MI,MO,MT,NJ,NY, NC,OH,OK,OR,PA,PR,SC,SD,TN,TX,UT,VA,WA, WI) updated motored cycle BODY TYPE, MAKE and MODEL.  Some of these changes triggered revisions to collateral data elements such as ROLLOVER, LOCATION OF ROLLOVER, EJECTION, EJECTION PATH, RESTRAINT SYSTEM USE, RELATED FACTORS-VEHICLE. 3. For many States (CA,FL,GA,IL,IN,IA,KY,MI,MS,NC,SC,TN,TX,WA,WI,GA), update Underride/Override; 4. For IL ST_CASE 170765, school bus related is changed to 1; 5. For ND, updated Various elements, all levels, crash, vehicle, driver, person 6. For MA ST_CASE 250293, update traffic way identifier and ownership. 7. Starting from this file release, the CSV files contain the (ID, TEXT) value for look-up data variables. 8. Starting from this file release, VINDecode files are not published any more.'
      - date: "2022-03-02"
        source: fars-2017-release-note
        description: 'The following updates are made for 2017 files: 1. Publish VPICDECODE and VPICTRAILERDECODE files. These files are created using NHTSA''s vPIC tool and contains the vPIC decode results for cleanly decoded VINs. For detailed information about this file, please refer to "Product Information Catalog and Vehicle Listing (vPIC) Analytical User''s Manual, 2020" 2. Updating Race and Hispanic Origin for Louisiana cases 3. MIACC, MIDRVACC, and MIPER files are updated 4. PER_AUX, VEH_AUX and ACC_AUX files are updated 5. Starting from this file release, the FARS file directory structure has been changed beginning 1982. Auxiliary files are zipped separately from the rest of the FARS files. For each year, there are two folders, one for national and one for Puerto Rico. In each folder, there are four zip files - one zip file for Auxiliary SAS files - one zip file for Auxiliary CSV files - one zip file for non-Auxiliary SAS files - one zip file for non-Auxiliary CSV files'
    tables:
      - id: accident
        label: Crashes (ACCIDENT data file)
        description: One row per fatal crash.
        sources: [fars-manual-1975-2024, fars-2017-csv]
        key: [ST_CASE]
      - id: vehicle
        label: Vehicles in transport (VEHICLE data file)
        description: One row per motor vehicle in transport involved in a crash.
        sources: [fars-manual-1975-2024, fars-2017-csv]
        key: [ST_CASE, VEH_NO]
        references:
          - columns: [ST_CASE]
            table: accident
      - id: person
        label: People (PERSON data file)
        description: >
          One row per person involved: occupants of motor vehicles, and
          non-motorists. (ST_CASE, VEH_NO) refers to the vehicle table for
          occupants of vehicles in transport (PER_TYP 1, 2, 9) and to the
          parkwork table for occupants of parked or working vehicles (PER_TYP 3);
          VEH_NO is 0 for non-motorists.
        sources: [fars-manual-1975-2024, fars-2017-csv]
        key: [ST_CASE, VEH_NO, PER_NO]
        references:
          - columns: [ST_CASE]
            table: accident
          - columns: [ST_CASE, VEH_NO]
            table: vehicle
            when: {column: PER_TYP, in: [1, 2, 9]}
          - columns: [ST_CASE, VEH_NO]
            table: parkwork
            when: {column: PER_TYP, in: [3]}
      - id: parkwork
        label: Parked and working vehicles (PARKWORK data file)
        description: >
          One row per parked or working motor vehicle involved in a crash. Its
          VEH_NO values don't overlap the vehicle table's in the same crash.
          Replaced the VEHNIT file in 2010.
        sources: [fars-manual-1975-2024, fars-2017-csv]
        key: [ST_CASE, VEH_NO]
        references:
          - columns: [ST_CASE]
            table: accident
