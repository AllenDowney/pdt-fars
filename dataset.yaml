standard_version: "0.1"
id: fars
title: Fatality Analysis Reporting System
publisher:
  name: National Highway Traffic Safety Administration (NHTSA), National Center for Statistics and Analysis
  url: https://www.nhtsa.gov/
url: https://www.nhtsa.gov/research-data/fatality-analysis-reporting-system-fars
description: >
  A census of fatal motor vehicle crashes in the 50 States, the District of
  Columbia and Puerto Rico since 1975, coded from police reports and other
  records. Not a survey: there are no questions, and "unknown" means the
  records didn't say.
citation: >
  National Center for Statistics and Analysis. (2026, April). Fatality Analysis
  Reporting System analytical user's manual, 1975-2024 (Report No. DOT HS 813
  794). National Highway Traffic Safety Administration.
  https://doi.org/10.21949/dz60-ft73
terms:
  url: https://www.nhtsa.gov/research-data/fatality-analysis-reporting-system-fars
  summary: >
    The manual's disclaimer says NHTSA distributes it "in the interest of
    information exchange" and that it "is available to the public"; it states no
    license or restriction, and FARS is a US government work. nhtsa.gov blocks
    scripts and headless browsers, so the site itself wasn't read. Allen Downey
    decided everything may ship.
  data: ship
  documentation: ship
  metadata: ship
  llm_processing: allowed
  reviewed_by: Allen Downey
  reviewed_on: "2026-11-19"
naming:
  case: upper
  note: SAS names, e.g. LGT_COND. The CSV files add a label column for most coded columns (LGT_CONDNAME).
dimensions:
  wave:
    label: data year
    column: YEAR
releases:
  - id: "2024"
    label: FARS 2024 national data files
    status: current
    sources: [fars-manual-1975-2024, fars-2024-csv]
    tables:
      - id: accident
        label: Crashes (ACCIDENT data file)
        description: One row per fatal crash.
        sources: [fars-manual-1975-2024, fars-2024-csv]
        key: [ST_CASE]
      - id: vehicle
        label: Vehicles in transport (VEHICLE data file)
        description: One row per motor vehicle in transport involved in a crash.
        sources: [fars-manual-1975-2024, fars-2024-csv]
        key: [ST_CASE, VEH_NO]
        references:
          - columns: [ST_CASE]
            table: accident
      - id: person
        label: People (PERSON data file)
        description: >
          One row per person involved: occupants of motor vehicles, and
          non-motorists. (ST_CASE, VEH_NO) refers to the vehicle table for
          occupants of vehicles in transport (PER_TYP 1, 2, 9) and to the
          parkwork table for occupants of parked or working vehicles (PER_TYP 3);
          VEH_NO is 0 for non-motorists.
        sources: [fars-manual-1975-2024, fars-2024-csv]
        key: [ST_CASE, VEH_NO, PER_NO]
        references:
          - columns: [ST_CASE]
            table: accident
          - columns: [ST_CASE, VEH_NO]
            table: vehicle
            when: {column: PER_TYP, in: [1, 2, 9]}
          - columns: [ST_CASE, VEH_NO]
            table: parkwork
            when: {column: PER_TYP, in: [3]}
      - id: parkwork
        label: Parked and working vehicles (PARKWORK data file)
        description: >
          One row per parked or working motor vehicle involved in a crash. Its
          VEH_NO values don't overlap the vehicle table's in the same crash.
          Replaced the VEHNIT file in 2010.
        sources: [fars-manual-1975-2024, fars-2024-csv]
        key: [ST_CASE, VEH_NO]
        references:
          - columns: [ST_CASE]
            table: accident
