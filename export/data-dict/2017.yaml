    details: |
      Codes: 1 = Convertible(excludes sun-roof,t-bar); 2 = 2-door sedan,hardtop,coupe; 3 = 3-door/2-door hatchback; 4 = 4-door sedan, hardtop; 5 = 5-door/4-door hatchback; 6 = Station Wagon (excluding van and truck based); 7 = Hatchback, number of doors unknown; 8 = Sedan/Hardtop, number of doors unknown; 9 = Other or Unknown automobile type; 10 = Auto-based pickup (includes E1 Camino, Caballero, Ranchero, SSR, G8-ST, Subaru Brat, Rabbit Pickup); 11 = Auto-Based Panel (Cargo Station Wagon, Auto-Based Ambulance or Hearse); 12 = Large Limousine – More Than 4 Side Doors or Stretch Chassis; 13 = Three-Wheel Automobile or Automobile Derivative; 14 = Compact Utility (Utility Vehicle Categories "Small" and "Midsize"); 15 = Large utility (ANSI D16.1 Utility Vehicle Categories and "Full Size" and "Large"); 16 = Utility station wagon (includes suburban limousines, Suburban, Travellall, Grand Wagoneer); 17 = 3-Door Coupe; 19 = Utility Unknown Body; 20 = Minivan (Chrysler Town and Country, Caravan, Grand Caravan, Voyager, Voyager, Honda-Odyssey, ...); 21 = Large Van-Includes van-based buses (B150-B350, Sportsman, Royal Maxiwagon, Ram, Tradesman,...); 22 = Step-van or walk-in van (<= 10,000 lbs. GVWR); 28 = Other Van Type (Hi-Cube Van); 32 = Pickup With Slide-in Camper; 33 = Convertible Pickup; 34 = Light Pickup; 40 = Cab Chassis Based (includes Rescue Vehicle, Light Stake, Dump, and Tow Truck); 41 = Truck-Based Panel; 42 = Light Truck-Based Motor Home (Chassis Mounted); 45 = Other Light Conventional Truck Type (Includes Stretched Suburban Limousine); 50 = School Bus; 51 = Cross-Country/Intercity Bus (i.e., Greyhound); 52 = Transit Bus (City Bus); 55 = Van-Based Bus GVWR > 10,000 lbs.; 58 = Other Bus Type; 60 = Step Van (GVWR > 10,000 lbs); 61 = Single-unit straight truck or Cab-Chassis (10,000 lbs. < GVWR < or = 19,500 lbs.); 62 = Single-unit straight truck or Cab-Chassis (19,500 lbs. < GVWR < or = 26,000 lbs.); 63 = Single-unit straight truck or Cab-Chassis (GVWR > 26,000 lbs.); 64 = Single-unit straight truck or Cab-Chassis (GVWR unknown); 65 = Medium/heavy truck based motorhome; 66 = Truck-tractor (Cab only, or with any number of trailing unit; any weight); 67 = Medium/heavy Pickup (>10,000 lbs. GVWR); 73 = Camper or motorhome, unknown truck type; 80 = Two Wheel Motorcycle (excluding motor scooters); 81 = Moped (Since 2022); 82 = Three-Wheel Motorcycle (2 Rear Wheels); 83 = Off-Road Motorcycle; 84 = Motor Scooter; 85 = Unenclosed Three Wheel Motorcycle / Unenclosed Autocycle (1 Rear Wheel); 86 = Enclosed Three-Wheel Motorcycle/Enclosed Autocycle (1 Rear Wheel); 88 = Other Motored Cycle Type (Mini-Bikes, Pocket Motorcycles, "Pocket Bikes"); 90 = ATV (All-Terrain Vehicle); 91 = Snowmobile; 92 = Farm equipment other than trucks; 93 = Construction equipment other than trucks (includes graders); 94 = Low-Speed Vehicle (LSV)/Neighborhood Electric Vehicle (NEV) (Since 2011); 95 = Golf Cart (Since 2012); 96 = Recreational Off-Highway Vehicle; 97 = Other vehicle type (includes go-cart, fork-lift, city street sweeper dunes/swamp buggy)

