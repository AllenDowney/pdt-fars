relationships:
- join: vehicle.ST_CASE = accident.ST_CASE
  cardinality: many-to-one
- join: person.ST_CASE = accident.ST_CASE
  cardinality: many-to-one
- join: person.ST_CASE = vehicle.ST_CASE AND person.VEH_NO = vehicle.VEH_NO
  cardinality: many-to-one
  description: Only for rows where PER_TYP is 1, 2 or 9.
- join: person.ST_CASE = parkwork.ST_CASE AND person.VEH_NO = parkwork.VEH_NO
  cardinality: many-to-one
  description: Only for rows where PER_TYP is 3.
