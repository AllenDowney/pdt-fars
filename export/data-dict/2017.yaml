  - name: ROLLOVER
    label: Rollover
    description: This data element identifies this vehicle’s involvement in a rollover or overturn during
      the crash. Rollover is defined as any vehicle rotation of 90° or more about any true longitudinal
      or lateral axis. Rollover can occur at any time during the crash.
    type: number(id)
    examples:
    - 0
    - 1
    - 2
    - 9
    details: |
      Codes: 0 = No Rollover; 1 = Rollover, Tripped by Object/Vehicle; 2 = Rollover, Untripped; 9 = Rollover, Unknown Type

      Notes: Data are not available from 1975 to 1977. Prior to 2016 the Data Element ID was V26. From 2016 to 2019 the Data Element ID was V27. Starting in 2022 this data element is derived from the “Sequence of Events” data element for each vehicle with an event equal to 01. See Appendix B: Rules for Derived Data Elements for an explanation of this data element and how it is derived. This data element also appears in the Person data file.

      Available: 2017
  - name: DEFORMED
    label: Extent of Damage
    description: This data element records the amount of damage sustained by this vehicle as indicated
      in the case material based on an operational damage scale.
    type: number(ordinal)
    range:
    - 0
    - 6
    details: |
      Codes: 0 = No Damage; 2 = Minor Damage; 4 = Functional Damage; 6 = Disabling Damage

      Notes: The data on 8 (Not Reportable) collected in 1976 are no longer contained in the data file. The data for that year are not consistent with the documentation of the time. The data element name was “Extent of Deformation” from 1975 to 2008. The data element’s name was changed to “Extent of Damage” in 2009. Prior to 2016 the Data Element ID was V29. From 2016 to 2019 the Data Element ID was V30. This data element also appears in the Parkwork Data File as PVEH_SEV.

      Available: 2017
  - name: DEFORMED__code
    label: 'Extent of Damage: missing code'
    description: 'Why `DEFORMED` is missing for this row: the code as published, as text. Null where the
      answer is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      '8': Not Reported [no_answer]
      '9': Unknown [unknown]
    details: Codes classified by rule:fars_missing_from_labels@0.2.
  - name: SPEEDREL
    label: Speeding Related
    description: This data element identifies if the driver was speeding, and it was related to the crash
      as identified by law enforcement.
    type: number(id)
    examples:
    - 0
    - 2
    - 3
    - 5
    - 8
    details: |
      Codes: 0 = No; 2 = Yes, Racing; 3 = Yes, Exceeded Speed Limit; 4 = Yes, Too Fast for Conditions; 5 = Yes, Specifics Unknown; 8 = No Driver Present/Unknown if Driver Present

      Notes: Prior to 2011, if no driver was present or the driver presence was unknown, then this data element was left blank. In SAS these blank values are represented by a single dot or period (.). Prior to 2013 this data element’s name was “Speed-Related.”

      Available: 2017
  - name: SPEEDREL__code
    label: 'Speeding Related: missing code'
    description: 'Why `SPEEDREL` is missing for this row: the code as published, as text. Null where the
      answer is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      '9': Unknown [unknown]
    details: Codes classified by rule:fars_missing_from_labels@0.2.
  - name: DR_DRINK
    label: Driver Drinking
    description: This data element records whether the driver was drinking.
    type: number(id)
    examples:
    - 0
    - 1
    details: |
      Codes: 0 = No; 1 = Yes

      Notes: This data element is derived from data elements in the Vehicle and Person data files. Data are analyzed and if there is "sufficient information" to conclude that a driver was drinking, i.e., positive BAC data or police-reported alcohol involvement, then a driver is classified as drinking. A driver is classified as drinking (alcohol-involved) if the driver has (1) police-reported alcohol involvement, or (2) a positive alcohol test result. A driver who is charged with an alcohol violation does not by itself make the driver a "drinking driver" by this definition. Note that alcohol data is often missing. For that reason, this data element may under-count the actual number of drinking drivers.

      Available: 2017
- name: person
  source:
    parquet: ../../data/processed/fars-2017-person.parquet
  label: People (PERSON data file)
  description: 'One row per person involved: occupants of motor vehicles, and non-motorists. (ST_CASE,
    VEH_NO) refers to the vehicle table for occupants of vehicles in transport (PER_TYP 1, 2, 9) and to
    the parkwork table for occupants of parked or working vehicles (PER_TYP 3); VEH_NO is 0 for non-motorists.'
  columns:
  - name: _row
    label: Row number
    description: The row's position in the publisher's file, from 0.
    type: number(id)
    examples:
    - 0
    - 1
    - 2
    - 3
    - 4
  - name: ST_CASE
    label: Consecutive Number
    description: This data element is the unique case number assigned to each crash. It appears on each
      data file and is used to merge information from the data files together.
    type: number
    range:
    - 10001
    - 560105
    examples:
    - 10001
    - 560105
    details: |
      Notes: This data element is a combination of the GSA State code and an assigned consecutive number. It is assigned by the data entry system to each crash and is the unique identifier for the crash within the year. It is used as the key when any two of these files from the same year are merged. This data element is stored as a numeric data element of six characters; the first two characters are the State code, and the next four characters are case number with leading zeros if necessary.

      Available: 2017
    constraints:
    - primary_key
    - foreign_key
  - name: VEH_NO
    label: Vehicle Number
    description: This data element is the consecutive number assigned to each vehicle in the case. This
      data element appears on each vehicle level data file and is used in conjunction with the ST_CASE
      data element to merge information from vehicle level data files.
    type: number
    range:
    - 0
    - 999
    examples:
    - 0
    - 999
    details: |
      Notes: All vehicles will have a positive integer value. The value 0 is only used for non-motorists (pedestrians, cyclists, etc.) in the Person File. There are no corresponding Vehicle records for non-motorists. ST_CASE and VEH_NO may be used to merge the complete Person File to the Accident File, but including the Vehicle File in the merge will eliminate non-motorists from the merged data. Non-Occupants have VEH_NO = 0, in this case see STR_VEH (N_MOT_NO prior to 2011) under Non-Motorist Striking Vehicle Number in the Person data file.

      Available: 2017
    constraints:
    - primary_key
    - foreign_key
  - name: PER_NO
    label: Person Number
    description: This data element is the consecutive number assigned to each person in the case (i.e.,
      each occupant, pedestrian, or non-motorists involved in the crash). This data element appears on
      each person level data file and is used in conjunction with the ST_CASE data element (and sometimes
      the VEH_NO data element) to merge information from person level data files.
    type: number
    range:
    - 1
    - 999
    examples:
    - 1
    - 999
    details: |
      Notes: Each occupant of the vehicle is numbered, and each non-occupant is numbered; in the case of a non-occupant the vehicle number is zero. The numbers for occupants are consecutive for each vehicle beginning with 1. Numbers are never skipped. Drivers do not have to be coded 1. Non- Occupants are identified by vehicle number 0 and are numbered consecutively starting with 1 for each non-motorist. To get drivers see data element PER_TYP under Person Type. PER_NO can be used in merges, e.g., when merging the FARS person data file with the multiple cause of death file.

      Available: 2017
    constraints:
    - primary_key
  - name: AGE
    label: P5/NM5. Age
    description: This data element identifies the person’s age in years on the date of the crash.
    type: number(quantity)
    range:
    - 1
    - 120
    details: |
      Codes: 0 = Less than One Year

      Available: 2017
  - name: AGE__code
    label: 'P5/NM5. Age: missing code'
    description: 'Why `AGE` is missing for this row: the code as published, as text. Null where the answer
      is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      '998': Not Reported [no_answer]
      '999': Unknown [unknown]
    details: Codes classified by rule:fars_missing_from_labels@0.2.
  - name: SEX
    label: P6/NM6. Sex
    description: This data element identifies the sex of this person involved in the crash.
    type: number(id)
    examples:
    - 1
    - 2
    details: |
      Codes: 1 = Male; 2 = Female

      Notes: From 1975 to 1981, if no information was known about the hit-and-run vehicle and/or driver, then neither the vehicle form nor the driver form was filled out and were not counted in the FARS census. Starting in 1982 both a vehicle and a driver form were filled out and the data were identified as unknown. This is why there were approximately only 20 to 40 drivers with unknown sex listed in the FARS data file from 1975 to 1981 and 700 to 1000 drivers with unknown sex from 1982 on. On March 22, 1995, a quick review of the 1994 Annual Report File revealed that of the 768 people in the 1994 data file with unknown sex; over 90 percent were involved in hit-and-run crashes.

      Available: 2017
  - name: SEX__code
    label: 'P6/NM6. Sex: missing code'
    description: 'Why `SEX` is missing for this row: the code as published, as text. Null where the answer
      is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      '8': Not Reported [no_answer]
      '9': Unknown [unknown]
    details: Codes classified by rule:fars_missing_from_labels@0.2.
  - name: PER_TYP
    label: P7/NM7. Person Type
    description: This data element describes the role of this person or non-motorist at the time they
      became involved in the crash.
    type: number(id)
    examples:
    - 1
    - 3
    - 5
    - 7
    - 10
    details: |
      Codes: 1 = Driver of a Motor Vehicle In-Transport; 2 = Passenger of a Motor Vehicle In-Transport; 3 = Occupant of a Motor Vehicle Not In- Transport; 4 = Occupant of a Non-Motor Vehicle Transport Device; 5 = Pedestrian; 6 = Bicyclist; 7 = Other Cyclist; 8 = Person on Personal Conveyances; 10 = Persons In/On Buildings

      Available: 2017
  - name: PER_TYP__code
    label: 'P7/NM7. Person Type: missing code'
    description: 'Why `PER_TYP` is missing for this row: the code as published, as text. Null where the
      answer is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      '9': Unknown Occupant Type in a Motor Vehicle In- Transport [unknown]
      '19': Unknown Type of Non-Motorist [unknown]
    details: Codes classified by rule:fars_missing_from_labels@0.2.
  - name: INJ_SEV
    label: P8/NM10. Injury Severity
    description: This data element describes the severity of the injury to this person in the crash using
      the KABCO scale.
    type: number(ordinal)
    range:
    - 0
    - 6
    details: |
      Codes: 0 = No Apparent Injury (O); 1 = Possible Injury (C); 2 = Suspected Minor Injury (B); 3 = Suspected Serious Injury (A); 4 = Fatal Injury (K); 5 = Injured, Severity Unknown; 6 = Died Prior to Crash*

      Notes: It is important to realize that some States do not always collect data on people who were in a crash but were not injured. If the analysis being performed depends on non-injured occupants— for example some paired comparisons—check the data at the State level. Prior to 2022 the Data Element ID was P8/NM8.

      Available: 2017
  - name: INJ_SEV__code
    label: 'P8/NM10. Injury Severity: missing code'
    description: 'Why `INJ_SEV` is missing for this row: the code as published, as text. Null where the
      answer is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      '9': Unknown/Not Reported [unknown]
    details: Codes classified by rule:fars_missing_from_labels@0.2.
  - name: SEAT_POS
    label: Seating Position
    description: This data element identifies the location of this person in or on the vehicle.
    type: number(id)
    examples:
    - 0
    - 21
    - 33
    - 49
    - 55
    details: |
      Codes: 0 = Not a Motor Vehicle Occupant; 11 = Front Seat, Left Side; 12 = Front Seat, Middle; 13 = Front Seat, Right Side; 18 = Front Seat, Other; 19 = Front Seat, Unknown; 21 = Second Seat, Left Side; 22 = Second Seat, Middle; 23 = Second Seat, Right Side; 28 = Second Seat, Other; 29 = Second Seat, Unknown; 31 = Third Seat, Left Side; 32 = Third Seat, Middle; 33 = Third Seat, Right Side; 38 = Third Seat, Other; 39 = Third Seat, Unknown; 41 = Fourth Seat, Left Side; 42 = Fourth Seat, Middle; 43 = Fourth Seat, Right Side; 48 = Fourth Seat, Other; 49 = Fourth Seat, Unknown; 50 = Sleeper Section of Cab (Truck); 51 = Other Passenger in enclosed passenger or cargo area; 52 = Other Passenger in unenclosed passenger or cargo area; 53 = Other Passenger in passenger or cargo area, unknown whether or not enclosed; 54 = Trailing Unit; 55 = Riding on Exterior of Vehicle

      Available: 2017
  - name: SEAT_POS__code
    label: 'Seating Position: missing code'
    description: 'Why `SEAT_POS` is missing for this row: the code as published, as text. Null where the
      answer is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      '98': Not Reported [no_answer]
      '99': Unknown [unknown]
    details: Codes classified by rule:fars_missing_from_labels@0.2.
  - name: REST_USE
    label: Restraint System Use
    description: This data element records the restraint equipment in use by this occupant at the time
      of the crash.
    type: number(id)
    examples:
    - 1
    - 5
    - 11
    - 17
    - 97
    details: |
      Codes: 1 = Shoulder Belt Only Used; 2 = Lap Belt Only Used; 3 = Shoulder and Lap Belt Used; 4 = Child Restraint Type Unknown; 5 = DOT-Compliant Motorcycle Helmet; 8 = Restraint Used - Type Unknown; 10 = Child Restraint System - Forward Facing; 11 = Child Restraint System  - Rear Facing; 12 = Booster Seat; 16 = Helmet, Other than DOT-Compliant Motorcycle Helmet; 17 = No Helmet; 19 = Helmet, Unknown if DOT Compliant; 20 = None Used / Not Applicable; 96 = Not a Motor Vehicle Occupant; 97 = Other

      Notes: Prior to 2019 this data element’s name was “Restraint System/Helmet Use” that included helmet use, and the Data Element ID was P10. Starting in 2019 helmet use is captured as part of the data element “Helmet Use.”

      Available: 2017
  - name: REST_USE__code
    label: 'Restraint System Use: missing code'
    description: 'Why `REST_USE` is missing for this row: the code as published, as text. Null where the
      answer is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      '29': Unknown if Helmet Worn [unknown]
      '98': Not Reported [no_answer]
      '99': Unknown [unknown]
    details: Codes classified by rule:fars_missing_from_labels@0.2.
  - name: DRINKING
    label: P16/NM18. Police Reported Alcohol Involvement
    description: This data element records whether alcohol was involved for this person and reflects the
      judgment of law enforcement.
    type: number(id)
    examples:
    - 0
    - 1
    details: |
      Codes: 0 = No (Alcohol Not Involved); 1 = Yes (Alcohol Involved)

      Notes: This data element does not indicate that alcohol was a cause of the crash. If a police crash report indicates that opened or unopened alcohol bottles were found in the vehicle, then this information does not by itself constitute involvement. Prior to 2019 the Data Element ID was P16/NM15. From 2019-2021 the Element Data ID was P16/NM16.

      Available: 2017
  - name: DRINKING__code
    label: 'P16/NM18. Police Reported Alcohol Involvement: missing code'
    description: 'Why `DRINKING` is missing for this row: the code as published, as text. Null where the
      answer is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      '8': Not Reported [no_answer]
      '9': Unknown (Police Reported) [unknown]
