name: fars
label: Fatality Analysis Reporting System
description: 'A census of fatal motor vehicle crashes in the 50 States, the District of Columbia and Puerto
  Rico since 1975, coded from police reports and other records. Not a survey: there are no questions,
  and "unknown" means the records didn''t say.'
details: |
  Publisher: National Highway Traffic Safety Administration (NHTSA), National Center for Statistics and Analysis (https://www.nhtsa.gov/)

  Release `2017`: FARS 2017 national data files (final file, last updated 2022-03-02) (current)

  Terms of use: https://www.nhtsa.gov/research-data/fatality-analysis-reporting-system-fars

  Citation: National Center for Statistics and Analysis. (2026, April). Fatality Analysis Reporting System analytical user's manual, 1975-2024 (Report No. DOT HS 813 794). National Highway Traffic Safety Administration. https://doi.org/10.21949/dz60-ft73

  Exported by the PublicDataToolkit library 0.1.0 from this repository's records (`metadata/`), which are canonical and hold what data-dict can't: missing-code types, availability, wording by wave, corrections, provenance, groups and links. See LOSSES.md.
origin: ../../build
tables:
- name: accident
  source:
    parquet: ../../data/processed/fars-2017-accident.parquet
  label: Crashes (ACCIDENT data file)
  description: One row per fatal crash.
  columns:
  - name: _row
    label: Row number
    description: The row's position in the publisher's file, from 0.
    type: number(id)
    examples:
    - 0
    - 1
    - 2
    - 3
    - 4
  - name: ST_CASE
    label: Consecutive Number
    description: This data element is the unique case number assigned to each crash. It appears on each
      data file and is used to merge information from the data files together.
    type: number
    range:
    - 10001
    - 560105
    examples:
    - 10001
    - 560105
    details: |
      Notes: This data element is a combination of the GSA State code and an assigned consecutive number. It is assigned by the data entry system to each crash and is the unique identifier for the crash within the year. It is used as the key when any two of these files from the same year are merged. This data element is stored as a numeric data element of six characters; the first two characters are the State code, and the next four characters are case number with leading zeros if necessary.

      Available: 2017
    constraints:
    - primary_key
  - name: STATE
    label: State Number
    description: This data element identifies the State in which the crash occurred. The codes are from
      the General Services Administration’s (GSA) publication of worldwide Geographic Location Codes (GLC).
    type: number(id)
    examples:
    - 1
    - 17
    - 30
    - 42
    - 56
    details: |
      Codes: 1 = Alabama; 2 = Alaska; 4 = Arizona; 5 = Arkansas; 6 = California; 8 = Colorado; 9 = Connecticut; 10 = Delaware; 11 = District of Columbia; 12 = Florida; 13 = Georgia; 15 = Hawaii; 16 = Idaho; 17 = Illinois; 18 = Indiana; 19 = Iowa; 20 = Kansas; 21 = Kentucky; 22 = Louisiana; 23 = Maine; 24 = Maryland; 25 = Massachusetts; 26 = Michigan; 27 = Minnesota; 28 = Mississippi; 29 = Missouri; 30 = Montana; 31 = Nebraska; 32 = Nevada; 33 = New Hampshire; 34 = New Jersey; 35 = New Mexico; 36 = New York; 37 = North Carolina; 38 = North Dakota; 39 = Ohio; 40 = Oklahoma; 41 = Oregon; 42 = Pennsylvania; 43 = Puerto Rico; 44 = Rhode Island; 45 = South Carolina; 46 = South Dakota; 47 = Tennessee; 48 = Texas; 49 = Utah; 50 = Vermont; 51 = Virginia; 53 = Washington; 54 = West Virginia; 55 = Wisconsin; 56 = Wyoming

      Notes: GSA State data elements except for 43, Puerto Rico. The State in which the vehicle is registered, REG_STAT, is found in the Vehicle data file; the coding is the same.

      Available: 2017
  - name: YEAR
    label: Year of Crash
    description: This data element records the year in which the crash occurred.
    type: number(quantity)
    range:
    - 2017
    - 2017
    details: 'Available: 2017'
  - name: MONTH
    label: Month of Crash
    description: This data element records the month in which the crash occurred.
    type: number(id)
    examples:
    - 1
    - 4
    - 7
    - 9
    - 12
    details: |
      Codes: 1 = January; 2 = February; 3 = March; 4 = April; 5 = May; 6 = June; 7 = July; 8 = August; 9 = September; 10 = October; 11 = November; 12 = December

      Notes: This data element also appears in the Vehicle and Person data files and in the Parkwork data file as PMONTH.

      Available: 2017
  - name: DAY_WEEK
    label: Day of Week
    description: This data element records the day of the week on which the crash occurred.
    type: number(id)
    examples:
    - 1
    - 3
    - 4
    - 5
    - 7
    details: |
      Codes: 1 = Sunday; 2 = Monday; 3 = Tuesday; 4 = Wednesday; 5 = Thursday; 6 = Friday; 7 = Saturday

      Notes: This data element has been calculated based on the year, month, and day.

      Available: 2017
  - name: HOUR
    label: Hour of Crash
    description: This data element records the hour at which the crash occurred.
    type: number(quantity)
    range:
    - 0
    - 23
    details: |
      Notes: All time is 24-hour military time. The time of the crash/arrival of the emergency medical service can occur in a different day than the arrival of emergency medical service at the crash scene/hospital. If you need to separate day and night, see the data element LGT_COND under the heading Light Condition. This data element also appears in the Vehicle and Person data files and in the Parkwork data file as PHOUR.

      Available: 2017
  - name: HOUR__code
    label: 'Hour of Crash: missing code'
    description: 'Why `HOUR` is missing for this row: the code as published, as text. Null where the answer
      is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      '99': Unknown Hours [unknown]
    details: Codes classified by rule:fars_missing_from_labels@0.2.
  - name: RUR_URB
    label: Rural Urban Classification
    description: This data element identifies the classification of the segment of the trafficway on which
      the crash occurred based on FHWA-approved adjusted Census boundaries of small urban and urbanized
      areas.
    type: number(id)
    examples:
    - 1
    - 2
    - 6
    details: |
      Codes: 1 = Rural; 2 = Urban; 6 = Trafficway Not in State Inventory

      Notes: From 1975 to 1986 there was a similar Land Use (LAND_USE) data element. From 1987 to 2014 urban and rural classifications can be obtained from the data element Roadway Function Class. Prior to 2023 this data element’s name was “Land Use.”

      Available: 2017
  - name: RUR_URB__code
    label: 'Rural Urban Classification: missing code'
    description: 'Why `RUR_URB` is missing for this row: the code as published, as text. Null where the
      answer is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      '8': Not Reported [no_answer]
      '9': Unknown [unknown]
    details: Codes classified by rule:fars_missing_from_labels@0.2.
  - name: LGT_COND
    label: Light Condition
    description: This data element records the type/level of light that existed at the time of the crash
      as indicated in the case material.
    type: number(id)
    examples:
    - 1
    - 3
    - 4
    - 5
    - 7
    details: |
      Codes: 1 = Daylight; 2 = Dark - Not Lighted; 3 = Dark - Lighted; 4 = Dawn; 5 = Dusk; 6 = Dark - Unknown Lighting; 7 = Other

      Notes: Prior to 2015 the Data Element ID was C24.

      Available: 2017
  - name: LGT_COND__code
    label: 'Light Condition: missing code'
    description: 'Why `LGT_COND` is missing for this row: the code as published, as text. Null where the
      answer is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      '8': Not Reported [no_answer]
      '9': Unknown [unknown]
    details: Codes classified by rule:fars_missing_from_labels@0.2.
  - name: WEATHER
    label: Atmospheric Conditions
    description: This derived data element records the prevailing atmospheric conditions that existed
      at the time of the crash as indicated in the case material.
    type: number(id)
    examples:
    - 1
    - 3
    - 6
    - 10
    - 12
    details: |
      Codes: 1 = Clear; 2 = Rain; 3 = Sleet or Hail; 4 = Snow; 5 = Fog, Smog, Smoke; 6 = Severe Crosswinds; 7 = Blowing Sand, Soil, Dirt; 8 = Other; 10 = Cloudy; 11 = Blowing Snow; 12 = Freezing Rain or Drizzle

      Notes: Prior to 2007 one value was coded for atmospheric condition. From 2007-2019 this data element was derived from up to two conditions that could be selected, WEATHER1 and WEATHER2, based on a hierarchy. The two coded data elements were discontinued after 2019 and moved to the Discontinued Accident Data Elements at the end of the Accident Data File section. Beginning in 2020 all applicable atmospheric conditions are selected and stored in the Weather data file, and this data element is derived from those multiple responses using the same hierarchy. See Appendix B: Rules for Derived Data Elements for an explanation of how this data element is derived. Prior to 2015 the Data Element ID was C25.

      Available: 2017
  - name: WEATHER__code
    label: 'Atmospheric Conditions: missing code'
    description: 'Why `WEATHER` is missing for this row: the code as published, as text. Null where the
      answer is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      '98': Not Reported [no_answer]
      '99': Unknown [unknown]
    details: Codes classified by rule:fars_missing_from_labels@0.2.
  - name: HARM_EV
    label: First Harmful Event
    description: This data element describes the first injury- or-damage producing event of the crash.
    type: number(id)
    examples:
    - 1
    - 15
    - 32
    - 48
    - 74
    details: |
      Codes: 1 = Rollover/Overturn; 2 = Fire/Explosion; 3 = Immersion or Partial Immersion; 4 = Gas Inhalation; 5 = Fell/Jumped from Vehicle; 6 = Injured In Vehicle (Non-Collision); 7 = Other Non-Collision; 8 = Pedestrian; 9 = Pedalcyclist; 10 = Railway Vehicle; 11 = Live Animal; 12 = Motor Vehicle In-Transport; 14 = Parked Motor Vehicle; 15 = Non-Motorist on Personal Conveyance; 16 = Thrown or Falling Object; 17 = Boulder; 18 = Other Object (not fixed); 19 = Building; 20 = Impact Attenuator/Crash Cushion; 21 = Bridge Pier or Support; 23 = Bridge Rail (Includes parapet); 24 = Guardrail Face; 25 = Concrete Traffic Barrier; 26 = Other Traffic Barrier; 30 = Utility Pole/Light Support; 31 = Post, Pole or Other Supports; 32 = Culvert; 33 = Curb; 34 = Ditch; 35 = Embankment; 38 = Fence; 39 = Wall; 40 = Fire Hydrant; 41 = Shrubbery; 42 = Tree (Standing Only); 43 = Other Fixed Object; 44 = Pavement Surface Irregularity (Ruts, Potholes, Grates, etc.); 45 = Working Motor Vehicle; 46 = Traffic Signal Support; 48 = Snow Bank; 49 = Ridden Animal or Animal Drawn Conveyance; 50 = Bridge Overhead Structure; 51 = Jackknife (harmful to this vehicle); 52 = Guardrail End; 53 = Mail Box; 54 = Motor Vehicle In-Transport Strikes or is Struck by Cargo, Persons or Objects Set-in-Motion from/by Another Motor Vehicle In Transport; 55 = Motor Vehicle in Motion Outside the Trafficway; 57 = Cable Barrier; 58 = Ground; 59 = Traffic Sign Support; 72 = Cargo/Equipment Loss or Shift (harmful to this vehicle); 73 = Object That Had Fallen From Motor Vehicle In-Transport; 74 = Road Vehicle on Rails

      Notes: “First Harmful Event” applies to the crash. “Most Harmful Event” (M_HARM) applies to the vehicle. Harmful events are judgment calls of the FARS analysts based on the data within the police crash report. From 2004 to 2009 the data elements “First Harmful Event,” “Most Harmful Event,” and the “Sequence of Events” have the same attributes. The harmful event attributes were modified to be consistent with the sequence of events data elements. Starting in 2009 these data elements still have the same attributes except non-harmful event attributes were added to the Sequence of Events data element. Starting in 2010 this data element is derived from the “Sequence of Events” data element as the first value that is not between codes 60 and 79 (non-harmful events). See Appendix B: Rules for Derived Data Elements for an explanation of this data element and how it is derived. Prior to 2015 the Data Element ID was C18. This data element also appears in the Vehicle and Person data files and in the Parkwork data file as PHARM_EV.

      Available: 2017
  - name: HARM_EV__code
    label: 'First Harmful Event: missing code'
    description: 'Why `HARM_EV` is missing for this row: the code as published, as text. Null where the
      answer is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      '91': Unknown Object Not Fixed [unknown]
      '93': Unknown Fixed Object [unknown]
      '99': Unknown [unknown]
    details: Codes classified by rule:fars_missing_from_labels@0.2.
  - name: MAN_COLL
    label: Manner of Collision of the First Harmful Event
    description: This data element describes the orientation of two motor vehicles in-transport when they
      are involved in the “First Harmful Event” of a collision crash. If the “First Harmful Event” is
      not a collision between two motor vehicles in-transport, it is classified as such.
    type: number(id)
    examples:
    - 0
    - 2
    - 7
    - 9
    - 11
    details: |
      Codes: 0 = Not a Collision with Motor Vehicle In-Transport; 1 = Front-to-Rear; 2 = Front-to-Front; 6 = Angle; 7 = Sideswipe - Same Direction; 8 = Sideswipe - Opposite Direction; 9 = Rear-to-Side; 10 = Rear-to-Rear; 11 = Other

      Notes: In the original data files from 1975 to 1977, sideswipe was coded as 5 but has since been changed to 7. These years are not consistent with the documentation of the time. Prior to 2015 the Data Element ID was C19. Prior to 2019 this data element’s name was “Manner of Collision.” This data element also appears in the Vehicle and Person data files and in the Parkwork data file as PMAN_COLL.

      Available: 2017
  - name: MAN_COLL__code
    label: 'Manner of Collision of the First Harmful Event: missing code'
    description: 'Why `MAN_COLL` is missing for this row: the code as published, as text. Null where the
      answer is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      '98': Not Reported [no_answer]
      '99': Unknown [unknown]
    details: Codes classified by rule:fars_missing_from_labels@0.2.
  - name: FATALS
    label: Fatalities
    description: This data element records the number of fatally injured people in the crash.
    type: number(quantity)
    range:
    - 1
    - 99
    details: |
      Notes: The data element is derived by counting all people with “Injury Severity” of 4 in the crash. The data element “Fatalities in Vehicle” in the Vehicle data file provides the number of deaths in a vehicle.

      Available: 2017
  - name: PERSONS
    label: Number of Person Forms Submitted
    description: This data element is a count of the number of Person Level (Motor Vehicle Occupant) Forms
      that are applicable to this case (i.e., occupants).
    type: number(quantity)
    range:
    - 0
    - 999
    details: |
      Notes: This represents the number of forms created for people in motor vehicles. It is the count of all people where “Person Type” is in (1, 2, 3, or 9). Before 2003 the policy was not to submit a Person Level form for occupants of van-based buses. Since 2003 a person level form has been submitted for all occupants of van-based vehicles, including van-based buses. 1975-1981: In the event of a hit-and-run crash, if the vehicle information was not known, then no vehicle form was filled out. Likewise, if no information was known on the person level, usually the driver of the unknown vehicle, then a Person Level form was not filled out. The result is that the number of unknowns is much smaller for this time period than 1982 and later. Example: From 1975 to 1980 there were 30 to 40 drivers coded with unknown sex, approximately 0.05 percent of all drivers involved in fatal crashes. In 1981 the number of drivers with unknown sex rose to over 300—approximately 0.5 percent of all drivers involved in fatal crashes. 1982-Later: In the case of a hit-and-run crash, a Vehicle Driver form and a Person Level form for the driver are filled out. When the information about the vehicle-driver or person is not known—which is often the case with hit-and-runs—the values are coded as unknown. Example: Between 1982 and 1994 the number of drivers coded with unknown sex fluctuated between 700 and 1,000—approximately 1.5 percent of all drivers involved in fatal crashes. Of the 768 people in the 1994 Annual Report file, all were drivers, and 90 percent of them were involved in hit-and-run crashes.

      Available: 2017
  - name: VE_TOTAL
    label: Number of Vehicle Forms Submitted—ALL
    description: This data element is the number of contact motor vehicles that the officer reported on
      the police crash report as a unit involved in the crash.
    type: number(quantity)
    range:
    - 1
    - 999
    details: |
      Notes: This number represents all of the motor vehicles in the crash. This includes the vehicles in- transport that are in the Vehicle data file and the vehicles not in-transport that are in the Parkwork data file (previously Vehnit). This data element only appears in the Accident data file. Note: The Parkwork data file replaced the Vehnit data file in 2010. The Vehnit data file does not exist prior to 2005.

      Available: 2017
- name: vehicle
  source:
    parquet: ../../data/processed/fars-2017-vehicle.parquet
  label: Vehicles in transport (VEHICLE data file)
  description: One row per motor vehicle in transport involved in a crash.
  columns:
  - name: _row
    label: Row number
    description: The row's position in the publisher's file, from 0.
    type: number(id)
    examples:
    - 0
    - 1
    - 2
    - 3
    - 4
  - name: ST_CASE
    label: Consecutive Number
    description: This data element is the unique case number assigned to each crash. It appears on each
      data file and is used to merge information from the data files together.
    type: number
    range:
    - 10001
    - 560105
    examples:
    - 10001
    - 560105
    details: |
      Notes: This data element is a combination of the GSA State code and an assigned consecutive number. It is assigned by the data entry system to each crash and is the unique identifier for the crash within the year. It is used as the key when any two of these files from the same year are merged. This data element is stored as a numeric data element of six characters; the first two characters are the State code, and the next four characters are case number with leading zeros if necessary.

      Available: 2017
    constraints:
    - primary_key
    - foreign_key
  - name: VEH_NO
    label: Vehicle Number
    description: This data element is the consecutive number assigned to each vehicle in the case. This
      data element appears on each vehicle level data file and is used in conjunction with the ST_CASE
      data element to merge information from vehicle level data files.
    type: number
    range:
    - 0
    - 999
    examples:
    - 0
    - 999
    details: |
      Notes: All vehicles will have a positive integer value. The value 0 is only used for non-motorists (pedestrians, cyclists, etc.) in the Person File. There are no corresponding Vehicle records for non-motorists. ST_CASE and VEH_NO may be used to merge the complete Person File to the Accident File, but including the Vehicle File in the merge will eliminate non-motorists from the merged data. Non-Occupants have VEH_NO = 0, in this case see STR_VEH (N_MOT_NO prior to 2011) under Non-Motorist Striking Vehicle Number in the Person data file.

      Available: 2017
    constraints:
    - primary_key
  - name: MOD_YEAR
    label: Vehicle Model Year
    description: This data element identifies the manufacturer’s model year of this vehicle.
    type: number(quantity)
    range:
    - 1927
    - 2018
    details: |
      Notes: Prior to 2020 the Data Element ID was V12. This data element also appears in the Person data file and in the Parkwork data file as PMODYEAR.

      Available: 2017
  - name: MOD_YEAR__code
    label: 'Vehicle Model Year: missing code'
    description: 'Why `MOD_YEAR` is missing for this row: the code as published, as text. Null where the
      answer is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      '9998': Not Reported [no_answer]
      '9999': Unknown [unknown]
    details: Codes classified by rule:fars_missing_from_labels@0.2.
  - name: BODY_TYP
    label: NCSA Body Type
    description: This data element identifies a classification of this vehicle based on its general body
      configuration, size, shape, doors, etc. as defined by NCSA.
    type: number(id)
    examples:
    - 1
    - 15
    - 50
    - 81
    - 97
    details: |
      Codes: 1 = Convertible(excludes sun-roof,t-bar); 2 = 2-door sedan,hardtop,coupe; 3 = 3-door/2-door hatchback; 4 = 4-door sedan, hardtop; 5 = 5-door/4-door hatchback; 6 = Station Wagon (excluding van and truck based); 7 = Hatchback, number of doors unknown; 8 = Sedan/Hardtop, number of doors unknown; 9 = Other or Unknown automobile type; 10 = Auto-based pickup (includes E1 Camino, Caballero, Ranchero, SSR, G8-ST, Subaru Brat, Rabbit Pickup); 11 = Auto-Based Panel (Cargo Station Wagon, Auto-Based Ambulance or Hearse); 12 = Large Limousine-more than four side doors or stretched chassis; 13 = Three-Wheel Automobile or Automobile Derivative; 14 = Compact Utility (Utility Vehicle Categories "Small" and "Midsize"); 15 = Large utility (ANSI D16.1 Utility Vehicle Categories and "Full Size" and "Large"); 16 = Utility station wagon (includes suburban limousines, Suburban, Travellall, Grand Wagoneer); 17 = 3-door coupe; 19 = Utility Vehicle, Unknown body type; 20 = Minivan (Chrysler Town and Country, Caravan, Grand Caravan, Voyager, Voyager, Honda-Odyssey, ...); 21 = Large Van-Includes van-based buses (B150-B350, Sportsman, Royal Maxiwagon, Ram, Tradesman,...); 22 = Step-van or walk-in van (<= 10,000 lbs. GVWR); 28 = Other van type (Hi-Cube Van, Kary); 32 = Pickup with slide-in camper; 33 = Convertible Pickup; 34 = Light Pickup; 40 = Cab Chassis Based (includes Rescue Vehicle, Light Stake, Dump, and Tow Truck); 41 = Truck-Based Panel; 42 = Light Truck-Based Motor Home (Chassis Mounted); 45 = Other light conventional truck type; 50 = School Bus; 51 = Cross Country/Intercity Bus; 52 = Transit Bus (City Bus); 55 = Van-Based Bus GVWR > 10,000 lbs.; 58 = Other Bus Type; 60 = Step van (>10,000 lbs. GVWR); 61 = Single-unit straight truck or Cab-Chassis (10,000 lbs. < GVWR < or = 19,500 lbs.); 62 = Single-unit straight truck or Cab-Chassis (19,500 lbs. < GVWR < or = 26,000 lbs.); 63 = Single-unit straight truck or Cab-Chassis (GVWR > 26,000 lbs.); 64 = Single-unit straight truck or Cab-Chassis (GVWR unknown); 65 = Medium/heavy truck based motorhome; 66 = Truck-tractor (Cab only, or with any number of trailing unit; any weight); 67 = Medium/heavy Pickup (>10,000 lbs. GVWR); 73 = Camper or motorhome, unknown truck type; 80 = Two Wheel Motorcycle (excluding motor scooters); 81 = Moped or motorized bicycle; 82 = Three-wheel Motorcycle (2 Rear Wheels); 83 = Off-road Motorcycle; 84 = Motor Scooter; 85 = Unenclosed Three Wheel Motorcycle / Unenclosed Autocycle (1 Rear Wheel); 86 = Enclosed Three-Wheel Motorcycle/Enclosed Autocycle (1 Rear Wheel); 88 = Other motored cycle type (mini-bikes, pocket motorcycles "pocket bikes"); 90 = ATV/ATC [All-Terrain Cycle]; 91 = Snowmobile; 92 = Farm equipment other than trucks; 93 = Construction equipment other than trucks (includes graders); 94 = Low-Speed Vehicle (LSV)/Neighborhood Electric Vehicle (NEV) (Since 2011); 95 = Golf Cart; 96 = Recreational Off-Highway Vehicle; 97 = Other vehicle type (includes go-cart, fork-lift, city street sweeper dunes/swamp buggy)

      Notes: This data element also appears in the Person data file and in the Parkwork data file as PBODYTYP. 1975-1981: Within the yearly NHTSA report Fatal Accident Reporting System, the term "Light Trucks" includes Vans. The body type data do not track with the original documentation. For example, documentation states that BODY_TYP EQ 7 is for utility vehicles. However, when the data files are examined, one sees that BODY_TYP EQ 43 is the value that will provide the desired result. The data files have been modified to make the early years for this data element compatible with 1981. Utility vehicles are also part of the light truck category. BODY_TYP 40, large limousines, are not included as part of Passenger Cars or Passenger Vehicles. 1982-1990: Within the yearly NHTSA report Fatal Accident Report System, the term “Light Truck” includes Vans. Utility vehicles are also part of the light-truck category. BODY_TYP 13, large limousines and BODY_TYP 14, three-wheel automobiles or automobile derivatives, are not included as part of Passenger Cars or Passenger Vehicles. A single-unit truck that tows another vehicle, or a bobtail by itself, is considered a combination truck. 1991-Later: Within the yearly NHTSA publication Traffic Safety Facts, the term "Light Trucks" includes Vans. BODY_TYP 12, large limousines and BODY_TYP 13, three-wheel automobiles or automobile derivatives, are not included as part of Passenger Cars or Passenger Vehicles. When defining School Buses 1993 and later be sure to include the new body type 24 (van-based school bus). However, body type 24 is not part of Buses. When defining Transit Buses 1993 and later be sure to include the new body type 25 (van-based transit bus). However, body type 25 is not part of Buses. A single-unit truck that tows another vehicle, or a bobtail, is considered a combination truck. Prior to 2020 this data element’s name was "Body Type" and the Data Element ID was V11.

      Available: 2017
