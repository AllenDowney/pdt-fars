      time it became an involved vehicle in the crash and was reported as a unit on the police crash report.
    type: number(id)
    examples:
    - 2
    - 3
    - 4
    details: |
      Codes: 2 = Motor Vehicle Not In-Transport Within the Trafficway; 3 = Motor Vehicle Not In-Transport Outside the Trafficway; 4 = Working Motor Vehicle (highway construction, maintenance, utility only)

      Notes: This data element also appears in the Vehicle data file as UNITTYPE. The only valid attribute for UNITTYPE is 1 (Motor Vehicle In-Transport [Inside or Outside the Trafficway]).

      Available: 2017
  - name: PNUMOCCS
    label: Number of Occupants
